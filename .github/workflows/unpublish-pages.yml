name: Unpublish GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish this repository's Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/${GH_REPO}/pages"
